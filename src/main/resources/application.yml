spring:
  application:
    name: tf-reader
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:10.28.25.234:8848}
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        fail-fast: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.28.25.234}:${MYSQL_PORT:3306}/fm_reader?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:10.28.25.234}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

server:
  port: 8103

app:
  reader:
    max-import-bytes: ${READER_MAX_IMPORT_BYTES:8388608}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
