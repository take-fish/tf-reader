spring:
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  application:
    name: tf-reader
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:10.28.13.214:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        fail-fast: false
        metadata:
          version: ${APP_VERSION:dev}
          git-commit: ${GIT_COMMIT:unknown}
      config:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        group: FM
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    # 默认值刻意指向本机：漏配环境变量时连不上并报错，而不是静默连到生产库。
    # 生产/测试栈由 compose 注入 MYSQL_HOST/PORT/DB（见 reader配置/*/.env），不依赖这里的默认值。
    # rewriteBatchedStatements=true：让 MySQL 驱动把批量 INSERT 合并成多值语句，
    # 否则 batchUpdate 只是省了往返次数，服务端仍逐条执行，导入上千章时差别很明显。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_reader}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_APP_USER:fm_reader_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      # 与数据源同样的原则：默认指向本机，漏配就快速失败，而不是静默连到共享 Redis。
      # 目前阅读服务尚未使用 Redis，保留依赖是为了将来多实例部署时的共享状态。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
  servlet:
    multipart:
      # 与 app.reader.max-import-bytes / fm.storage.max-file-bytes 保持一致（25 MiB）；
      # max-request-size 留 1MB 余量给表单其他字段。
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: 8103
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  # 运行环境标识：统一 JSON 日志的 env 字段来源；生产/测试栈分别注入 production/test
  environment: ${APP_ENV:production}
  version: ${APP_VERSION:dev}
  reader:
    max-import-bytes: ${READER_MAX_IMPORT_BYTES:26214400}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

fm:
  common:
    error:
      service-unavailable-code: READER_UNAVAILABLE
      service-unavailable-message: 阅读服务暂不可用
  # 统一鉴权：身份由网关签名头注入；直连调试可用 Bearer 回退到用户中台。
  auth:
    enabled: ${FM_AUTH_ENABLED:true}
    user-service-url: ${TF_USER_URL:http://127.0.0.1:8101}
    identity-secret: ${FM_IDENTITY_SECRET:}
    allow-bearer-fallback: ${FM_AUTH_BEARER_FALLBACK:true}
    cache-ttl: ${FM_AUTH_CACHE_TTL:30s}
    public-paths:
      - /api/v1/reader/health
      - /api/v1/reader/meta
  # 书籍原文落本地卷（Docker 命名卷），章节仍存数据库，权限只由数据库记录决定。
  storage:
    enabled: ${FM_STORAGE_ENABLED:true}
    base-dir: ${FM_STORAGE_BASE_DIR:./data/files}
    max-file-bytes: ${FM_STORAGE_MAX_BYTES:26214400}
